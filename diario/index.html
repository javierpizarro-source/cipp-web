<style>html,body{margin:0;min-height:100%;background:#f4f6f5}#root{min-height:100vh}@media (min-width: 800px){#root > div{max-width:1100px!important;min-height:100vh;box-shadow:0 0 30px rgba(18,41,47,.08)}#root > div > div[role="alert"]{padding-left:32px!important;padding-right:32px!important}#root > div > div:nth-child(3){padding:34px 32px 70px!important}#root > div > div:nth-child(3):has(> section[aria-labelledby="identify-title"]){display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-content:start;gap:22px!important}#root section[aria-labelledby="identify-title"],#root section[aria-labelledby="video-title"]{margin:0;min-width:0}#root > div > div:nth-child(3):has(> section[aria-labelledby="identify-title"]) > button{grid-column:1/-1;max-width:420px;justify-self:center}#root video{max-height:320px}}@media (max-width: 799px){#root > div{width:100%}}</style>
